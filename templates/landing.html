<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.R.I.D - Ground Recon & Intelligent Detection</title>
 
    <!-- PWA -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#3ecf8e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="G.R.I.D">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'JetBrains Mono', monospace; background-color: #0a0c10; color: #cbd5e1; margin: 0; overflow: hidden; }
        .grid-canvas {
            background-image: radial-gradient(rgba(62, 207, 142, 0.1) 1.5px, transparent 1.5px);
            background-size: 60px 60px;
            width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1;
        }
        .soft-glow { text-shadow: 0 0 25px rgba(62, 207, 142, 0.4); }
        .btn-launch {
            border: 1px solid rgba(62, 207, 142, 0.3);
            background: rgba(13, 17, 23, 0.6);
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-launch:hover {
            background: #3ecf8e; color: #000;
            box-shadow: 0 0 40px rgba(62, 207, 142, 0.3); border-color: #3ecf8e;
        }
        
        /* Logo styling */
        .logo-container {
            width: 120px;
            height: 120px;
            margin-bottom: 2rem;
            filter: drop-shadow(0 0 20px rgba(62, 207, 142, 0.3));
            animation: logo-pulse 3s ease-in-out infinite;
        }
        
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        @keyframes logo-pulse {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(62, 207, 142, 0.3)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 35px rgba(62, 207, 142, 0.5)); transform: scale(1.02); }
        }
    </style>
</head>
<body class="overflow-hidden">
 
    <div class="grid-canvas"></div>
 
    <div class="relative z-10 flex flex-col items-center justify-center h-screen">
        
        <!-- LOGO G.R.I.D (substitui o raio) -->
        <div class="logo-container">
            <img src="/static/logo.png" alt="G.R.I.D Logo">
        </div>
 
        <div class="text-center space-y-2 mb-16">
            <h1 class="text-6xl font-black tracking-[-0.05em] text-white soft-glow italic uppercase">G.R.I.D</h1>
            <p class="text-[9px] tracking-[0.5em] text-slate-500 uppercase font-bold">Ground Recon & Intelligent Detection</p>
        </div>
 
        <a href="/login" class="btn-launch px-16 py-4 rounded-full text-[10px] font-bold tracking-[0.3em] uppercase group">
            <span class="flex items-center gap-3">
                Começar
                <svg class="w-4 h-4 transition-transform group-hover:translate-x-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </span>
        </a>
 
        <div class="absolute bottom-10 text-[9px] text-slate-600 tracking-widest uppercase font-bold">
            G.R.I.D OS | PAP 2026 | Centro de Comando
        </div>

    </div>
 
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/service-worker.js')
                    .then(reg => console.log('[SW] G.R.I.D OS registado:', reg.scope))
                    .catch(err => console.warn('[SW] Falha:', err));
            });
        }
    </script>
</body>
</html>
