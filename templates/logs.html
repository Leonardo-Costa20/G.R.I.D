<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.R.I.D OS | Mission Logs</title>
    
    <!-- PWA -->
    <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#3ecf8e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="G.R.I.D">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/i18n.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d1117;
            --sidebar-bg: #161b22;
            --card-bg: rgba(22, 27, 34, 0.8);
            --text-main: #c9d1d9;
            --win-border: rgba(48, 54, 61, 0.8);
            --accent: #3ecf8e;
            --accent-dim: rgba(62, 207, 142, 0.1);
            --danger: #f85149;
            --warning: #f0883e;
            --grid-color: rgba(62, 207, 142, 0.05);
        }

        body.light-mode {
            --bg-color: #f0f4f8;
            --sidebar-bg: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.96);
            --text-main: #1a202c;
            --text-nav: #4a5568;
            --win-border: rgba(0, 0, 0, 0.1);
            --grid-color: rgba(0, 0, 0, 0.05);
        }

        body.light-mode .log-row td { color: var(--text-main); }
        body.light-mode .log-row td.font-bold { color: #1a202c !important; }
        body.light-mode .log-row:hover { background: rgba(62, 207, 142, 0.06); }
        body.light-mode thead tr { color: #4a5568; }
        body.light-mode .filter-input { color-scheme: light; }
    </style>
</head>
<body class="flex h-screen z-10 relative">

    <div class="grid-canvas-sm"></div>

    <!-- Sidebar -->
    {% set active_page = 'logs' %}
    {% include '_sidebar.html' %}

    <main class="flex-1 p-8 flex flex-col gap-6 overflow-y-auto z-10">
        
        <!-- Header -->
        <header class="flex justify-between items-center border-b border-[var(--win-border)] pb-4">
            <div>
                <h1 class="logs-page-title text-xl font-extrabold tracking-wider uppercase" style="color:var(--text-main);">G.R.I.D OS // Mission Logs</h1>
                <p class="text-xs mt-1" style="color:var(--text-nav);"><span class="logs-session-label">Sessão ativa como:</span> <span class="text-[var(--accent)] font-bold">{{ username }}</span></p>
            </div>
            <div class="flex gap-3">
                <!-- Exportar CSV -->
                <button onclick="exportCSV()" class="export-btn bg-[var(--accent-dim)] border-[var(--accent)]/30 text-[var(--accent)] hover:bg-[var(--accent)] hover:text-black">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    CSV
                </button>
                <!-- Exportar PDF -->
                <button onclick="exportPDF()" class="export-btn bg-red-500/10 border-red-500/30 text-red-400 hover:bg-red-500 hover:text-white">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    PDF
                </button>
            </div>
        </header>

        <!-- Stats Bar -->
        <section class="stats-bar p-4 rounded-lg flex gap-8 text-xs">
            <div>
                <span class="stat-total-label text-gray-500 uppercase tracking-widest text-[10px]">Total de Registos</span>
                <div class="text-2xl font-bold mt-1" style="color:var(--text-main);" id="stat-total">--</div>
            </div>
            <div>
                <span class="stat-page-label text-gray-500 uppercase tracking-widest text-[10px]">Página Atual</span>
                <div class="text-2xl font-bold text-[var(--accent)] mt-1" id="stat-page">--</div>
            </div>
            <div>
                <span class="stat-sensors-label text-gray-500 uppercase tracking-widest text-[10px]">Sensores Disponíveis</span>
                <div class="text-2xl font-bold text-blue-400 mt-1" id="stat-sensors">--</div>
            </div>
            <div class="ml-auto flex items-center gap-2">
                <span class="stat-update-label text-[10px] text-gray-500 uppercase">Última Actualização</span>
                <span class="text-[var(--accent)] font-bold" id="last-update">--:--:--</span>
            </div>
        </section>

        <!-- Filtros -->
        <section class="log-card p-4">
            <div class="flex flex-wrap gap-4 items-end">
                <div>
                    <label class="filter-sensor-label block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">Sensor</label>
                    <select id="filter-sensor" class="filter-input w-40" onchange="loadLogs(1)">
                        <option value="">Todos os Sensores</option>
                    </select>
                </div>
                <div>
                    <label class="filter-start-label block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">Data Início</label>
                    <input type="date" id="filter-start" class="filter-input" onchange="loadLogs(1)">
                </div>
                <div>
                    <label class="filter-end-label block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">Data Fim</label>
                    <input type="date" id="filter-end" class="filter-input" onchange="loadLogs(1)">
                </div>
                <div class="ml-auto">
                    <button onclick="resetFilters()" class="btn-clear-filters text-[10px] text-gray-500 hover:text-[var(--danger)] uppercase font-bold transition-colors">
                        Limpar Filtros
                    </button>
                </div>
            </div>
        </section>

        <!-- Tabela de Logs -->
        <section class="log-card flex-1 flex flex-col overflow-hidden min-h-[400px]">
            <div class="p-4 border-b border-[var(--win-border)] flex justify-between items-center">
                <h2 class="logs-table-title text-xs font-bold uppercase tracking-widest text-white">Registos da Missão</h2>
                <span class="text-[10px] text-gray-500" id="showing-info">A carregar...</span>
            </div>
            
            <div class="flex-1 overflow-auto">
                <table class="w-full text-left text-[11px]">
                    <thead class="sticky top-0 z-10" style="background: var(--sidebar-bg);">
                        <tr class="border-b border-[var(--win-border)] text-gray-500 font-bold uppercase text-[10px]">
                            <th class="th-alert p-4 w-12">Alerta</th>
                            <th class="th-timestamp p-4">Timestamp</th>
                            <th class="th-sensor p-4">Sensor</th>
                            <th class="th-value p-4">Valor</th>
                            <th class="th-message p-4">Mensagem</th>
                            <th class="th-category p-4 text-right">Categoria</th>
                        </tr>
                    </thead>
                    <tbody id="logs-table-body" class="divide-y" style="border-color: var(--win-border);">
                        <!-- Logs são injectados aqui via JS -->
                    </tbody>
                </table>
            </div>

            <!-- Paginação -->
            <div class="p-4 border-t border-[var(--win-border)] flex justify-between items-center">
                <span class="text-[10px] text-gray-500" id="pagination-info"></span>
                <div class="flex gap-2" id="pagination-controls">
                    <!-- Botões de paginação injectados via JS -->
                </div>
            </div>
        </section>
    </main>

    <script>
        let currentPage = 1;
        let currentFilters = { sensor: '', start: '', end: '' };

        // Carrega lista de sensores para o filtro
        function loadSensors() {
            $.get('/api/logs/sensors', function(data) {
                const select = $('#filter-sensor');
                select.html('<option value="">Todos os Sensores</option>');
                data.sensors.forEach(sensor => {
                    select.append(`<<option value="${sensor}">${sensor}</option>`);
                });
                $('#stat-sensors').text(data.sensors.length);
            });
        }

        // Carrega os logs com paginação
        function loadLogs(page = 1) {
            currentPage = page;
            currentFilters = {
                sensor: $('#filter-sensor').val(),
                start: $('#filter-start').val(),
                end: $('#filter-end').val()
            };

            const tbody = $('#logs-table-body');
            tbody.html(`
                <tr><td colspan="6" class="p-8 text-center">
                    <div class="flex flex-col items-center gap-3">
                        <div class="w-8 h-8 loading-skeleton rounded-full"></div>
                        <span class="text-gray-500 text-[10px] uppercase tracking-widest">A sincronizar com a base de dados...</span>
                    </div>
                </td></tr>
            `);

            $.get('/api/logs', {
                page: page,
                per_page: 25,
                sensor: currentFilters.sensor,
                start: currentFilters.start,
                end: currentFilters.end
            }, function(data) {
                renderLogs(data);
                updateStats(data);
                renderPagination(data);
                $('#last-update').text(new Date().toLocaleTimeString());
            }).fail(function(xhr) {
                tbody.html(`
                    <tr><td colspan="6" class="p-8 text-center text-red-500 text-[10px] uppercase tracking-widest">
                        Erro ao carregar logs: ${xhr.responseJSON?.error || 'Conexão falhou'}
                    </td></tr>
                `);
            });
        }

        function getSensorBadgeClass(origem) {
            if (!origem) return 'badge-default';
            if (origem === 'MQ2') return 'badge-mq2';
            if (origem === 'Distancia') return 'badge-dist';
            if (origem.startsWith('Acel_') || origem.startsWith('Gyro_')) return 'badge-mpu';
            if (origem === 'Temperatura' || origem === 'Pressao') return 'badge-bmp';
            if (origem === 'gas') return 'badge-gas';
            if (origem === 'temperatura') return 'badge-temp';
            if (origem === 'pressao') return 'badge-pressao';
            if (origem === 'altitude') return 'badge-altitude';
            if (origem === 'tilt') return 'badge-tilt';
            return 'badge-default';
        }

        function renderLogs(data) {
            const tbody = $('#logs-table-body');
            tbody.empty();

            if (!data.logs || data.logs.length === 0) {
                tbody.html(`
                    <tr><td colspan="6" class="p-12 text-center">
                        <div class="text-gray-500 text-[10px] uppercase tracking-widest">
                            Nenhum registo encontrado para os filtros seleccionados
                        </div>
                    </td></tr>
                `);
                return;
            }

            data.logs.forEach(log => {
                const alertClass = `alert-${log.nivel_alerta || 0}`;
                const alertLabel = (log.nivel_alerta || 0) === 0 ? 'NORMAL' : 
                                  (log.nivel_alerta || 0) === 1 ? 'ATENÇÃO' : 'CRÍTICO';
                
                const badgeClass = getSensorBadgeClass(log.origem);

                const date = new Date(log.data_hora);
                const timeStr = date.toLocaleString('pt-PT', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                });

                const valorFormatted = typeof log.valor === 'number' ? log.valor.toFixed(2) : log.valor;

                tbody.append(`
                    <tr class="log-row group">
                        <td class="p-4">
                            <span class="alert-indicator ${alertClass}" title="${alertLabel}"></span>
                        </td>
                        <td class="p-4 font-mono text-gray-400">${timeStr}</td>
                        <td class="p-4">
                            <span class="sensor-badge ${badgeClass}">${log.origem || 'N/A'}</span>
                        </td>
                        <td class="p-4 font-bold text-white">${valorFormatted}</td>
                        <td class="p-4 text-gray-400">${log.mensagem || '-'}</td>
                        <td class="p-4 text-right">
                            <span class="text-[10px] text-gray-500 uppercase">${log.categoria || 'SENSOR'}</span>
                        </td>
                    </tr>
                `);
            });

            const start = (data.page - 1) * data.per_page + 1;
            const end = Math.min(start + data.logs.length - 1, data.total);
            $('#showing-info').text(`A mostrar ${start}-${end} de ${data.total} registos`);
        }

        function updateStats(data) {
            $('#stat-total').text(data.total.toLocaleString('pt-PT'));
            $('#stat-page').text(`${data.page}/${data.total_pages}`);
        }

        function renderPagination(data) {
            const container = $('#pagination-controls');
            container.empty();

            $('#pagination-info').text(`Página ${data.page} de ${data.total_pages}`);

            container.append(`
                <button class="pagination-btn" onclick="loadLogs(${data.page - 1})" ${!data.has_prev ? 'disabled' : ''}>
                    ← Anterior
                </button>
            `);

            const maxButtons = 5;
            let startPage = Math.max(1, data.page - Math.floor(maxButtons / 2));
            let endPage = Math.min(data.total_pages, startPage + maxButtons - 1);
            
            if (endPage - startPage < maxButtons - 1) {
                startPage = Math.max(1, endPage - maxButtons + 1);
            }

            if (startPage > 1) {
                container.append(`<<button class="pagination-btn" onclick="loadLogs(1)">1</button>`);
                if (startPage > 2) container.append(`<<span class="text-gray-500 px-2">...</span>`);
            }

            for (let i = startPage; i <= endPage; i++) {
                container.append(`
                    <button class="pagination-btn ${i === data.page ? 'active' : ''}" onclick="loadLogs(${i})">
                        ${i}
                    </button>
                `);
            }

            if (endPage < data.total_pages) {
                if (endPage < data.total_pages - 1) container.append(`<<span class="text-gray-500 px-2">...</span>`);
                container.append(`<<button class="pagination-btn" onclick="loadLogs(${data.total_pages})">${data.total_pages}</button>`);
            }

            container.append(`
                <button class="pagination-btn" onclick="loadLogs(${data.page + 1})" ${!data.has_next ? 'disabled' : ''}>
                    Próximo →
                </button>
            `);
        }

        function resetFilters() {
            $('#filter-sensor').val('');
            $('#filter-start').val('');
            $('#filter-end').val('');
            loadLogs(1);
        }

        function exportCSV() {
            const params = new URLSearchParams({
                sensor: currentFilters.sensor,
                start: currentFilters.start,
                end: currentFilters.end
            });
            window.open(`/api/logs/export?${params.toString()}`, '_blank');
        }

        function exportPDF() {
            const params = new URLSearchParams({
                sensor: currentFilters.sensor,
                start: currentFilters.start,
                end: currentFilters.end
            });
            window.open(`/api/logs/export/pdf?${params.toString()}`, '_blank');
        }

        // Auto-refresh a cada 30 segundos
        setInterval(() => {
            loadLogs(currentPage);
        }, 30000);

        $(document).ready(function() {
            loadSensors();
            loadLogs(1);
        });
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('grid_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        }
        if (localStorage.getItem('grid_theme') === 'light') document.body.classList.add('light-mode');
        applyPageLang('logs');
    </script>
</body>
</html>
