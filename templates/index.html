<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.R.I.D OS | Mission Control</title>
 
    <!-- PWA -->
    <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#3ecf8e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="G.R.I.D">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/joystick.css">
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/joystick.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d1117;
            --sidebar-bg: #161b22;
            --text-main: #c9d1d9;
            --text-nav: #8b949e;
            --window-bg: rgba(22, 27, 34, 0.96);
            --win-header: rgba(48, 54, 61, 0.5);
            --grid-color: rgba(62, 207, 142, 0.1);
            --win-border: rgba(48, 54, 61, 0.8);
            --accent: #3ecf8e;
        }
        body.light-mode {
            --bg-color: #f0f4f8;
            --sidebar-bg: #ffffff;
            --text-main: #1a202c;
            --text-nav: #4a5568;
            --window-bg: rgba(255, 255, 255, 0.96);
            --win-header: #edf2f7;
            --grid-color: rgba(0, 0, 0, 0.05);
            --win-border: rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="flex h-screen">
 
    <div class="grid-canvas"></div>
 
    <!-- ══════════════════════════════════════
         SIDEBAR (desktop)
    ══════════════════════════════════════ -->
    {% set active_page = 'dashboard' %}
    {% include '_sidebar.html' %}
 
    <!-- ══════════════════════════════════════
         WORKSPACE DESKTOP (janelas drag)
    ══════════════════════════════════════ -->
    <main id="workspace" class="flex-1 relative">
        <!-- Header do dashboard — estilo Admin Panel -->
        <div class="dash-header" style="position:absolute;top:0;left:0;right:0;z-index:500;pointer-events:none;user-select:none;padding:14px 28px 12px;border-bottom:1px solid var(--win-border);display:flex;justify-content:space-between;align-items:center;background:transparent;">
            <div>
                <div class="dash-header-title" style="font-family:'JetBrains Mono',monospace;font-size:1.2rem;font-weight:800;letter-spacing:0.08em;color:var(--text-main);text-transform:uppercase;text-shadow:0 1px 8px var(--sidebar-bg),0 0 20px var(--sidebar-bg);">G.R.I.D OS <span style="color:var(--text-nav);font-weight:300;">//</span> Dashboard</div>
                <div style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:400;color:var(--text-nav);margin-top:2px;letter-spacing:0.1em;text-shadow:0 1px 6px var(--sidebar-bg);"><span class="dash-session-label">Sessão ativa como:</span> <span style="color:#3ecf8e;font-weight:700;">{{ username }}</span></div>
            </div>
            <div style="display:flex;align-items:center;gap:16px;">
                <div style="background:var(--sidebar-bg);border:1px solid var(--win-border);border-radius:10px;padding:8px 14px;display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;">
                    <span id="rover-dot"></span>
                    <span style="color:var(--text-nav);">ROVER_01:</span>
                    <span id="rover-status-text" style="color:var(--text-nav);">A AGUARDAR</span>
                </div>
                <div style="background:var(--sidebar-bg);border:1px solid var(--win-border);border-radius:10px;padding:8px 14px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:2px;color:#3ecf8e;">
                    <span id="dashboard-clock">--:--:--</span>
                </div>
            </div>
        </div>
        <!-- Watermark central desfocada -->
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:0;pointer-events:none;user-select:none;white-space:nowrap;">
            <span style="font-family:'JetBrains Mono',monospace;font-size:clamp(4rem,12vw,10rem);font-weight:800;letter-spacing:0.15em;color:rgba(62,207,142,0.06);text-transform:uppercase;filter:blur(6px);">G.R.I.D</span>
        </div>
    </main>
 
    <!-- ══════════════════════════════════════
         WORKSPACE MOBILE (cards estáticos)
    ══════════════════════════════════════ -->
    <main id="mobile-workspace">
        <!-- Título mobile -->
        <div style="padding:16px 16px 0;pointer-events:none;user-select:none;">
            <span style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:0.25em;color:rgba(62,207,142,0.5);text-transform:uppercase;">G.R.I.D</span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:400;letter-spacing:0.15em;color:rgba(100,116,139,0.5);text-transform:uppercase;"> // Dashboard</span>
        </div>
        <div id="mobile-camera-slot"></div>
        <div id="mobile-cards-grid"></div>
    </main>
 
    <!-- ══════════════════════════════════════
         BOTTOM NAV (mobile)
    ══════════════════════════════════════ -->
    <nav id="bottom-nav">
        <button class="bnav-item" onclick="mobileOpen('camera','LIVE_FEED')">
            <svg viewBox="0 0 24 24"><path stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            <span class="bnav-camera-label">Câmera</span>
        </button>
        <button class="bnav-item" onclick="toggleMobileDrawer()">
            <svg viewBox="0 0 24 24"><path stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
            <span class="bnav-sensors-label">Sensores</span>
        </button>
        <button class="bnav-item" onclick="toggleTheme()">
            <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <span class="bnav-theme-label">Tema</span>
        </button>
        <a href="/settings" class="bnav-item">
            <svg viewBox="0 0 24 24"><path stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><circle cx="12" cy="12" r="3" stroke-width="2"></circle></svg>
            <span class="bnav-settings-label">Definições</span>
        </a>
        <a href="/logout" class="bnav-item text-red-400">
            <svg viewBox="0 0 24 24"><path stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7"></path></svg>
            <span class="bnav-logout-label">Sair</span>
        </a>
    </nav>
 
    <!-- Drawer mobile de sensores -->
    <div id="mobile-sensor-drawer">
        <button class="drawer-btn" onclick="mobileOpen('dist','DISTÂNCIA'); toggleMobileDrawer()">
            <svg viewBox="0 0 24 24"><path stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2z"></path></svg>
            HC-SR04
        </button>
        <button class="drawer-btn" onclick="mobileOpen('gas','GAS'); toggleMobileDrawer()">
            <svg viewBox="0 0 24 24"><path stroke-width="2" d="M12 2C8 2 5 5.5 5 9c0 2.5 1.5 4.7 3.5 5.8V17a1 1 0 001 1h5a1 1 0 001-1v-2.2C17.5 13.7 19 11.5 19 9c0-3.5-3-7-7-7z"></path></svg>
            <span class="drawer-label-gas">Gás</span>
        </button>
        <button class="drawer-btn" onclick="mobileOpen('temperatura','TEMPERATURA'); toggleMobileDrawer()">
            <svg viewBox="0 0 24 24"><path stroke-width="2" d="M14 14.76V3.5a2.5 2.5 0 00-5 0v11.26a4.5 4.5 0 105 0z"></path></svg>
            <span class="drawer-label-temp">Temperatura</span>
        </button>
        <button class="drawer-btn" onclick="mobileOpen('pressao','PRESSAO'); toggleMobileDrawer()">
            <svg viewBox="0 0 24 24"><path stroke-width="2" d="M12 2a10 10 0 100 20A10 10 0 0012 2zm0 4v4l3 3"></path></svg>
            <span class="drawer-label-pressure">Pressão</span>
        </button>
        <button class="drawer-btn" onclick="mobileOpen('altitude','ALTITUDE'); toggleMobileDrawer()">
            <svg viewBox="0 0 24 24"><path stroke-width="2" d="M3 17l4-8 4 4 4-6 4 4"></path></svg>
            <span class="drawer-label-altitude">Altitude</span>
        </button>
        <button class="drawer-btn" onclick="mobileOpen('tilt','INCLINAÇÃO'); toggleMobileDrawer()">
            <svg viewBox="0 0 24 24"><path stroke-width="2" d="M12 2L2 19h20L12 2z"></path></svg>
            <span class="drawer-label-tilt">Inclinação</span>
        </button>
    </div>
 

 
    <script>
        const USER_ROLE = '{{ role }}';
        const socket = io();
        let zIdx = 100;
        let folderOpenState = false;
        let drawerOpen = false;
 
        const isMobile = () => window.innerWidth <= 768;
 
        // ── Tema ────────────────────────────────────────────────
        function toggleTheme() { 
            document.body.classList.toggle('light-mode'); 
            localStorage.setItem('grid_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        }
 
        // ── Sidebar desktop: pasta de sensores ──────────────────
        function toggleFolderManual() {
            folderOpenState = !folderOpenState;
            const arrow = document.getElementById('folder-arrow');
            if (folderOpenState) { $('#sensor-folder').slideDown(300); if(arrow) arrow.textContent='▲'; }
            else                 { $('#sensor-folder').slideUp(300);   if(arrow) arrow.textContent='▼'; }
        }

 
        // ── Drawer mobile de sensores ───────────────────────────
        function toggleMobileDrawer() {
            drawerOpen = !drawerOpen;
            const drawer = document.getElementById('mobile-sensor-drawer');
            if (drawerOpen) {
                drawer.style.display = 'grid';
                requestAnimationFrame(() => drawer.style.opacity = '1');
            } else {
                drawer.style.display = 'none';
            }
        }
 
        // ── Auto Tile (desktop) ─────────────────────────────────
        function autoTile() {
            const janelas = $('.window-node:visible');
            if (janelas.length === 0) return;

            const hh    = $('.dash-header').outerHeight() || 65;
            const gap   = 12;
            const padL  = 10, padT = hh + 10;
            const ws    = document.getElementById('workspace');
            const workW = ws.clientWidth;
            const workH = ws.clientHeight;

            let x = padL, y = padT, rowH = 0;

            janelas.each(function() {
                let w = $(this).outerWidth();
                let h = $(this).outerHeight();

                // Reduz só se for mais larga que o workspace
                if (w > workW - padL * 2) w = workW - padL * 2;

                // Passa para próxima linha se não couber
                if (x + w > workW - padL && x > padL) {
                    x = padL; y += rowH + gap; rowH = 0;
                }

                // Reduz altura só se sair abaixo do ecrã
                const maxH = workH - y - 10;
                if (h > maxH) h = Math.max(160, maxH);

                $(this).stop().animate({ left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }, 400);
                x += w + gap;
                if (h > rowH) rowH = h;
            });
        }
 
        function mobileScrollTop() {
            document.getElementById('mobile-workspace').scrollTo({ top: 0, behavior: 'smooth' });
        }
 
        // ── Mapa de dados dos sensores (tópicos MQTT reais) ─────
        // MQTT: G.R.I.D/MQ2, G.R.I.D/Distancia, G.R.I.D/Acel_X, G.R.I.D/Gyro_X, G.R.I.D/Temperatura, G.R.I.D/Pressao
        // Novos: G.R.I.D/gas, G.R.I.D/temperatura, G.R.I.D/pressao, G.R.I.D/altitude, G.R.I.D/tilt
        const sensorMap = { 
            mq2: 'MQ2', 
            dist: 'Distancia', 
            mpu: 'Acel_X',          // MPU6050 envia Acel_X, Acel_Y, Acel_Z, Gyro_X, Gyro_Y, Gyro_Z
            bmp: 'Temperatura',     // BMP280 envia Temperatura e Pressao
            gas: 'gas',
            temperatura: 'temperatura',
            pressao: 'pressao',
            altitude: 'altitude',
            tilt: 'tilt'
        };
        const unitMap   = { 
            mq2: 'ppm', 
            dist: 'cm', 
            mpu: 'm/s²', 
            bmp: '°C',
            gas: 'ppm',
            temperatura: '°C',
            pressao: 'hPa',
            altitude: 'm',
            tilt: '°'
        };
        const labelMap  = { 
            mq2: 'MQ2', 
            dist: 'HC-SR04', 
            mpu: 'ADXL345', 
            bmp: 'BMP280',
            gas: 'MQ2',
            temperatura: 'BMP280',
            pressao: 'BMP280',
            altitude: 'BMP280',
            tilt: 'ADXL345'
        };
 
        // ── Criar janela (desktop) ──────────────────────────────
        function createWindow(type, title) {
            if (isMobile()) { mobileOpen(type, title); return; }
 
            const id = `win-${type}`;
            if (document.getElementById(id)) { zIdx++; $(`#${id}`).css('z-index', zIdx); return; }
 
            const body = type === 'tilt' ?
                `<div class="window-content p-6 flex flex-col items-center justify-center gap-4" style="height:100%;">
                    <div class="label-sub" style="font-size:9px;letter-spacing:2px;opacity:.5;text-transform:uppercase;">Inclinação (Tilt)</div>
                    <div style="position:relative;width:200px;height:60px;display:flex;align-items:center;justify-content:center;">
                        <!-- Rover silhouette bar -->
                        <div id="tilt-bar" style="
                            width:160px;height:18px;
                            background:linear-gradient(90deg,#3ecf8e22,#3ecf8e44,#3ecf8e22);
                            border:1.5px solid #3ecf8e;
                            border-radius:4px;
                            position:relative;
                            transition:transform 0.4s cubic-bezier(.4,0,.2,1);
                            transform:rotate(0deg);
                        ">
                            <!-- wheels -->
                            <div style="position:absolute;bottom:-7px;left:12px;width:16px;height:8px;background:#3ecf8e;border-radius:3px;opacity:.7;"></div>
                            <div style="position:absolute;bottom:-7px;right:12px;width:16px;height:8px;background:#3ecf8e;border-radius:3px;opacity:.7;"></div>
                            <!-- center dot -->
                            <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:6px;height:6px;background:#3ecf8e;border-radius:50%;"></div>
                        </div>
                        <!-- horizon line -->
                        <div style="position:absolute;width:200px;height:1px;background:rgba(62,207,142,0.15);top:50%;left:0;"></div>
                    </div>
                    <div style="display:flex;align-items:baseline;gap:6px;">
                        <span id="val-tilt" style="font-size:2.2rem;font-weight:800;color:var(--accent);line-height:1;">--</span>
                        <span style="font-size:11px;opacity:.4;">°</span>
                    </div>
                    <div id="tilt-status" style="font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-nav);">--</div>
                </div>` : type === 'camera' ?
                `<div class="window-content bg-black w-full h-full flex items-center justify-center overflow-hidden relative" style="aspect-ratio:3/4">
                    <img src="https://camera.gridos.space/stream" class="w-full h-full" style="transform:rotate(90deg);object-fit:cover;width:100%;height:100%"
                         onerror="this.style.display='none';document.getElementById('cam-err').classList.remove('hidden')"/>
                    ${['admin','pilot'].includes(USER_ROLE) ? `<button onclick="fetch('/api/flash')" style="position:absolute;top:8px;left:8px;z-index:10;width:32px;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.5);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)" title="Flash">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
                            <rect x="9" y="2" width="6" height="3" rx="0.5"/>
                            <rect x="7" y="5" width="10" height="12" rx="1.5"/>
                            <rect x="8" y="15" width="8" height="2" rx="0.5"/>
                            <path d="M8.5 17l-1 2M12 17v2.5M15.5 17l1 2"/>
                        </svg>
                    </button>` : ''}
                    <div id="cam-err" class="hidden text-[10px] text-red-500 font-bold animate-pulse">[NO SIGNAL]</div>
                </div>` : type === 'joystick' ?
                `<div class="window-content p-6">
                    <div class="joystick-panel">
                        <div class="label-sub">Joystick de Controlo</div>
                        <div class="joystick-frame" id="joystick-frame">
                            <div class="joystick-stick" id="joystick-stick"></div>
                        </div>
                        <div class="drive-status">
                            <span id="drive-direction">PARADO</span> · <strong id="drive-speed">60%</strong>
                        </div>

                    </div>
                </div>` :
                `<div class="window-content p-6">
                    <div class="label-sub">${labelMap[type]||title}</div>
                    <div class="sensor-val">
                        <span id="val-${sensorMap[type]}">--</span>
                        <span class="text-xs ml-2 opacity-30">${unitMap[type]}</span>
                    </div>
                </div>`;

            const w = type === 'camera' ? '460px' : type === 'joystick' ? '360px' : type === 'tilt' ? '300px' : '340px';
            const h = type === 'camera' ? '290px' : type === 'joystick' ? '430px' : type === 'tilt' ? '260px' : '200px';
            const hh2 = $('.dash-header').outerHeight() || 65;

            const windowNode = $(`<div id="${id}" class="window-node" style="width:${w};height:${h};top:${hh2+10}px;left:100px;">
                <div class="window-handle flex justify-between items-center">
                    <span class="text-[9px] font-bold text-[#3ecf8e] uppercase tracking-widest">${title}</span>
                    <button onclick="$(this).closest('.window-node').remove()" class="text-gray-400 hover:text-red-500 transition-colors">✕</button>
                </div>
                ${body}
            </div>`)
            .appendTo('#workspace')
            .draggable({ handle:'.window-handle', containment:'parent',
                start: function(){ zIdx++; $(this).css('z-index',zIdx).addClass('dragging'); },
                drag:  function(e, ui){
                    const hh = $('.dash-header').outerHeight() || 65;
                    if(ui.position.top < hh) ui.position.top = hh;
                },
                stop:  function(){ $(this).removeClass('dragging'); }
            })
            .resizable({ handles:'se', minWidth: type === 'joystick' ? 320 : 240, minHeight: type === 'joystick' ? 340 : 160, containment:'parent' })
            .mousedown(function(){ zIdx++; $(this).css('z-index',zIdx); });

            if (type === 'joystick') {
                initJoystickWindow();
            }
        }

        // ── Abrir card (mobile) ─────────────────────────────────
        function mobileOpen(type, title) {
            const id = `mcard-${type}`;
            const existing = document.getElementById(id);
            if (existing) { existing.scrollIntoView({ behavior:'smooth', block:'start' }); return; }

            const isCamera = type === 'camera';
            const body = isCamera ?
                `<div class="mobile-camera-body" style="position:relative">
                    <img src="https://camera.gridos.space/stream" style="width:100%;height:100%;object-fit:cover;transform:rotate(-90deg)"
                         onerror="this.style.display='none'"/>
                    <span style="color:#f85149;font-size:10px;font-weight:700;display:none" class="anim-pulse">[NO SIGNAL]</span>
                </div>` :
                type === 'tilt' ?
                `<div class="mobile-card-body" style="display:flex;flex-direction:column;align-items:center;gap:8px;">
                    <div style="font-size:7px;text-transform:uppercase;letter-spacing:1.5px;opacity:.4;">Inclinação</div>
                    <div style="position:relative;width:120px;height:36px;display:flex;align-items:center;justify-content:center;">
                        <div id="tilt-bar-m" style="width:100px;height:12px;background:linear-gradient(90deg,#3ecf8e22,#3ecf8e44,#3ecf8e22);border:1.5px solid #3ecf8e;border-radius:3px;transition:transform 0.4s cubic-bezier(.4,0,.2,1);transform:rotate(0deg);position:relative;">
                            <div style="position:absolute;bottom:-5px;left:8px;width:10px;height:5px;background:#3ecf8e;border-radius:2px;opacity:.7;"></div>
                            <div style="position:absolute;bottom:-5px;right:8px;width:10px;height:5px;background:#3ecf8e;border-radius:2px;opacity:.7;"></div>
                        </div>
                        <div style="position:absolute;width:120px;height:1px;background:rgba(62,207,142,0.15);top:50%;left:0;"></div>
                    </div>
                    <div class="mobile-sensor-val"><span id="mval-tilt">--</span><span style="font-size:10px;opacity:.4;">°</span></div>
                </div>` :
                `<div class="mobile-card-body">
                    <div style="font-size:7px;text-transform:uppercase;letter-spacing:1.5px;opacity:.4;margin-bottom:4px">${labelMap[type]||title}</div>
                    <div class="mobile-sensor-val">
                        <span id="mval-${sensorMap[type]}">--</span>
                    </div>
                    <div class="mobile-sensor-unit">${unitMap[type]}</div>
                </div>`;

            const card = $(`
                <div id="${id}" class="mobile-card${isCamera ? ' wide' : (type === 'tilt' ? ' wide-tall' : '')}">
                    <div class="mobile-card-header">
                        <span>${title}</span>
                        <button onclick="document.getElementById('${id}').remove()">✕</button>
                    </div>
                    ${body}
                </div>
            `).appendTo(isCamera ? '#mobile-camera-slot' : '#mobile-cards-grid');

            card[0].scrollIntoView({ behavior:'smooth', block:'start' });
        }
 
        // ── WebSocket: dados sensores ───────────────────────────
        // O servidor Flask emite: {sensor: 'MQ2', valor: '123.45'} ou {sensor: 'Distancia', valor: '45.2'}
        // MPU6050: Acel_X, Acel_Y, Acel_Z, Gyro_X, Gyro_Y, Gyro_Z
        // BMP280: Temperatura, Pressao
        // Novos: gas, temperatura, pressao, altitude, tilt
        socket.on('mqtt_data', (data) => {
            // Atualiza todos os displays que correspondem a este sensor
            const sensor = data.sensor;
            const valor = data.valor;
            
            // MQ2
            if (sensor === 'MQ2') {
                $('#val-MQ2').text(valor);
                $('#mval-MQ2').text(valor);
            }
            // HC-SR04
            else if (sensor === 'Distancia') {
                $('#val-Distancia').text(valor);
                $('#mval-Distancia').text(valor);
            }
            // MPU6050 - Aceleração
            else if (sensor.startsWith('Acel_') || sensor.startsWith('Gyro_')) {
                $('#val-Acel_X').text(valor);
                $('#mval-Acel_X').text(valor);
            }
            // BMP280 - Temperatura
            else if (sensor === 'Temperatura') {
                $('#val-Temperatura').text(valor);
                $('#mval-Temperatura').text(valor);
            }
            // BMP280 - Pressão
            else if (sensor === 'Pressao') {
                $('#val-Pressao').text(valor);
                $('#mval-Pressao').text(valor);
            }
            // Sensor de Gás (G.R.I.D/gas)
            else if (sensor === 'gas') {
                $('#val-gas').text(valor);
                $('#mval-gas').text(valor);
            }
            // Temperatura (G.R.I.D/temperatura)
            else if (sensor === 'temperatura') {
                $('#val-temperatura').text(valor);
                $('#mval-temperatura').text(valor);
            }
            // Pressão (G.R.I.D/pressao)
            else if (sensor === 'pressao') {
                $('#val-pressao').text(valor);
                $('#mval-pressao').text(valor);
            }
            // Altitude (G.R.I.D/altitude)
            else if (sensor === 'altitude') {
                $('#val-altitude').text(valor);
                $('#mval-altitude').text(valor);
            }
            // Tilt (G.R.I.D/tilt)
            else if (sensor === 'tilt') {
                const graus = parseFloat(valor);
                $('#val-tilt').text(isNaN(graus) ? '--' : graus.toFixed(1));
                $('#mval-tilt').text(isNaN(graus) ? '--' : graus.toFixed(1) + '°');
                if (!isNaN(graus)) {
                    const clamped = Math.max(-45, Math.min(45, graus));
                    $('#tilt-bar').css('transform', `rotate(${-clamped}deg)`);
                    $('#tilt-bar-m').css('transform', `rotate(${-clamped}deg)`);
                    let status = 'PLANO';
                    if (graus > 5)       status = '▲ A SUBIR';
                    else if (graus < -5) status = '▼ A DESCER';
                    $('#tilt-status').text(status);
                }
            }
        });
 
        // ── WebSocket: status rover ─────────────────────────────
        socket.on('rover_status_update', (data) => {
            const dot  = document.getElementById('rover-dot');
            const text = document.getElementById('rover-status-text');
            if (data.status === 'online') {
                dot.className = 'online';
                text.textContent = 'ROVER ONLINE';
            } else {
                dot.className = 'offline';
                text.textContent = 'ROVER OFFLINE';
            }
        });
 
        // ── Init ────────────────────────────────────────────────
        $(document).ready(() => {
            if (localStorage.getItem('grid_theme') === 'light') document.body.classList.add('light-mode');
            applyPageLang('dashboard');

            // Relógio em tempo real
            function updateClock() {
                const now = new Date();
                const h = String(now.getHours()).padStart(2,'0');
                const m = String(now.getMinutes()).padStart(2,'0');
                const s = String(now.getSeconds()).padStart(2,'0');
                const el = document.getElementById('dashboard-clock');
                if (el) el.textContent = h + ':' + m + ':' + s;
            }
            updateClock();
            setInterval(updateClock, 1000);
        });
    </script>
</body>
</html>
