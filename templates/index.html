<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.R.I.D OS | Mission Control</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d1117;
            --sidebar-bg: #161b22;
            --text-main: #c9d1d9;
            --window-bg: rgba(22, 27, 34, 0.96);
            --win-header: rgba(48, 54, 61, 0.5);
            --grid-color: rgba(62, 207, 142, 0.1);
            --win-border: rgba(48, 54, 61, 0.8);
            --accent: #3ecf8e;
        }

        body.light-mode {
            --bg-color: #f0f4f8;
            --sidebar-bg: #ffffff;
            --text-main: #1a202c;
            --window-bg: rgba(255, 255, 255, 0.96);
            --win-header: #edf2f7;
            --grid-color: rgba(0, 0, 0, 0.05);
            --win-border: rgba(0, 0, 0, 0.1);
        }

        body { 
            font-family: 'JetBrains Mono', monospace; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            overflow: hidden; 
            transition: background-color 0.3s ease;
        }

        .grid-canvas {
            background-image: radial-gradient(var(--grid-color) 1.5px, transparent 1.5px);
            background-size: 40px 40px;
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
        }

        #sidebar {
            width: 70px; background-color: var(--sidebar-bg); 
            border-right: 1px solid var(--win-border); z-index: 1000;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden;
        }
        #sidebar:hover { width: 240px; }

        .nav-item {
            width: 100%; display: flex; align-items: center; padding: 15px 24px;
            color: #8b949e; font-size: 11px; font-weight: 700;
            transition: 0.2s; white-space: nowrap; border: none; background: none; cursor: pointer;
        }
        .nav-item:hover { color: var(--accent); background: rgba(62, 207, 142, 0.05); }
        .nav-item svg { min-width: 22px; height: 22px; margin-right: 20px; }
        .nav-text { opacity: 0; transition: opacity 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        #sidebar:hover .nav-text { opacity: 1; }

        .window-node { 
            position: absolute !important; background-color: var(--window-bg) !important;
            border: 1px solid var(--win-border) !important; border-radius: 16px; 
            display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            backdrop-filter: blur(12px); min-width: 200px; min-height: 150px; overflow: hidden; z-index: 10;
        }
        .window-node.active-win { border-color: var(--accent) !important; box-shadow: 0 0 20px rgba(62, 207, 142, 0.2); }
        .window-handle { background-color: var(--win-header); border-bottom: 1px solid var(--win-border); padding: 12px 18px; cursor: move; flex-shrink: 0; }
        .window-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; overflow: hidden; width: 100%; height: 100%; }
        .ui-resizable-se { width: 14px !important; height: 14px !important; right: 8px !important; bottom: 8px !important; background: none !important; border-right: 3px solid var(--accent); border-bottom: 3px solid var(--accent); border-bottom-right-radius: 6px; opacity: 0.3; }
        .window-node:hover .ui-resizable-se { opacity: 1; }
        .sensor-val { font-size: clamp(1.2rem, 6vw, 3rem); font-weight: 800; color: var(--accent); line-height: 1; }
        .label-sub { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.4; margin-bottom: 8px; }
    </style>
</head>
<body class="flex h-screen">

    <div class="grid-canvas"></div>

    <aside id="sidebar" class="flex flex-col py-8">
        <div class="px-5 mb-10 text-[#3ecf8e]">
            {% if role == 'admin' %}
                <a href="/admin" title="Aceder à Consola Admin" class="block hover:text-white transition-colors cursor-pointer group">
                    <svg class="w-10 h-10 transition-transform group-hover:scale-105 filter group-hover:drop-shadow-[0_0_8px_rgba(62,207,142,0.6)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                </a>
            {% else %}
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            {% endif %}
        </div>

        <nav class="flex flex-col gap-1">
            <button onclick="createWindow('camera', 'LIVE_FEED')" class="nav-item">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                <span class="nav-text">Câmera Rover</span>
            </button>
            <button onclick="createWindow('dist', 'TELEMETRY')" class="nav-item">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2z"></path></svg>
                <span class="nav-text">Distância</span>
            </button>
            <button onclick="createWindow('smoke', 'GAS_ANALYSIS')" class="nav-item">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span class="nav-text">Sensor MQ2</span>
            </button>
            <button onclick="autoTile()" class="nav-item text-blue-400">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                <span class="nav-text">Arrumar Janelas</span>
            </button>
        </nav>

        <div class="mt-auto border-t border-gray-800/30 pt-4">
            <button class="nav-item" onclick="toggleTheme()">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span class="nav-text">Mudar Tema</span>
            </button>
            <a href="/logout" class="nav-item text-red-400">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7"></path></svg>
                <span class="nav-text">Sair</span>
            </a>
        </div>
    </aside>

    <main id="workspace" class="flex-1 relative"></main>

    <script>
        const socket = io();
        let zIdx = 100;
        const chaveUsuario = 'grid_janelas_ativas_' + '{{ username }}';

        // --- IP DO ROVER (Substitui pelo IP real do teu ESP32-CAM ou Raspberry Pi se necessário) ---
        // Se usares um fluxo local, podes definir a URL diretamente aqui
        const STREAM_URL = "http://172.20.10.4:81/stream"; // ALTERA ESTE IP PARA O DO TEU ROVER

        function toggleTheme() { 
            document.body.classList.toggle('light-mode'); 
            const tema = document.body.classList.contains('light-mode') ? 'light' : 'dark';
            localStorage.setItem('grid_theme', tema);
        }

        function restaurarTema() {
            const temaGuardado = localStorage.getItem('grid_theme');
            if (temaGuardado === 'light') document.body.classList.add('light-mode');
        }

        function autoTile() {
            const janelas = $('.window-node:visible');
            if (janelas.length === 0) return;

            const gap = 25; 
            const paddingSuperior = 50;
            const paddingEsquerdo = 100; 
            
            const workspaceW = $('#workspace').width();
            const workspaceH = $('#workspace').height();
            
            const slotLargura = 380; 
            const slotAltura = 250;

            let col = 0;
            let row = 0;
            zIdx = 100;

            janelas.each(function() {
                const win = $(this);
                zIdx++;
                win.css('z-index', zIdx);

                let posX = paddingEsquerdo + (col * (slotLargura + gap));
                let posY = paddingSuperior + (row * (slotAltura + gap));

                if (posX + 200 > workspaceW + paddingEsquerdo) { 
                    col = 0;
                    row++;
                    posX = paddingEsquerdo + (col * (slotLargura + gap));
                    posY = paddingSuperior + (row * (slotAltura + gap));
                }

                if (posY + 100 > workspaceH) {
                    row = 0;
                    col = 0;
                    posX = paddingEsquerdo + 30; 
                    posY = paddingSuperior + 30;
                }

                win.stop().animate({ 
                    left: posX + 'px', 
                    top: posY + 'px'
                }, 500, 'swing');

                col++; 
            });

            setTimeout(salvarEstadoJanelas, 600);
        }

        socket.on('mqtt_data', (data) => {
            if(data.sensor === 'MQ2') $('#val-MQ2').text(data.valor);
            if(data.sensor === 'Distancia') $('#val-Distancia').text(data.valor);
        });

        function focusWin(el) { zIdx++; el.css('z-index', zIdx); }

        function salvarEstadoJanelas() {
            let janelasAbertas = [];
            $('.window-node').each(function() {
                const type = this.id.replace('win-', '');
                const title = $(this).find('.window-handle span').text();
                janelasAbertas.push({ type: type, title: title });
            });
            localStorage.setItem(chaveUsuario, JSON.stringify(janelasAbertas));
        }

        function restaurarEstadoJanelas() {
            const dados = localStorage.getItem(chaveUsuario);
            if (dados) {
                const janelas = JSON.parse(dados);
                janelas.forEach(win => { createWindow(win.type, win.title); });
                setTimeout(autoTile, 200);
            }
        }

        function createWindow(type, title) {
            const id = `win-${type}`;
            if(document.getElementById(id)) { focusWin($(`#${id}`)); return; }

            let contentBody = '';
            if(type === 'camera') {
                // Adicionada a tag <img> que carrega o fluxo de vídeo contínuo em MJPEG
                contentBody = `
                    <div class="window-content bg-black w-full h-full relative flex items-center justify-center overflow-hidden">
                        <img id="rover-video-feed" src="${STREAM_URL}" 
                             alt="LIVE_STREAM" 
                             class="w-full h-full object-cover text-[10px] text-gray-500 font-bold" 
                             onerror="this.style.display='none'; $('#camera-error').removeClass('hidden');" />
                        <div id="camera-error" class="hidden text-[10px] text-red-500 font-mono font-bold animate-pulse">
                            [ERRO]: LINK DA CÂMARA INDISPONÍVEL
                        </div>
                    </div>`;
            } else {
                const dataId = type === 'dist' ? 'Distancia' : 'MQ2';
                const unit = type === 'dist' ? 'cm' : 'ppm';
                contentBody = `<div class="window-content p-6"><div class="label-sub">Real-time Telemetry</div><div class="sensor-val"><span id="val-${dataId}">--</span><span class="text-xs ml-2 opacity-30">${unit}</span></div></div>`;
            }

            // Se for câmara, aumentamos um pouco o tamanho padrão para ficar retangular (proporção de vídeo)
            const defaultW = type === 'camera' ? '450px' : '340px';
            const defaultH = type === 'camera' ? '280px' : '200px';

            const win = $(`
                <div id="${id}" class="window-node" style="width:${defaultW}; height:${defaultH}; top:150px; left:150px;">
                    <div class="window-handle flex justify-between items-center">
                        <span class="text-[9px] font-bold text-[#3ecf8e] uppercase tracking-widest">${title}</span>
                        <button onclick="$(this).closest('.window-node').remove(); salvarEstadoJanelas();" class="text-gray-500 hover:text-white transition-colors">✕</button>
                    </div>
                    ${contentBody}
                </div>
            `).appendTo('#workspace')
              .draggable({ 
                  handle: ".window-handle", containment: "parent",
                  start: function() { focusWin($(this)); $(this).addClass('active-win'); },
                  stop: function() { $(this).removeClass('active-win'); salvarEstadoJanelas(); }
              })
              .resizable({ 
                  handles: "se", minWidth: 240, minHeight: 180, containment: "parent",
                  stop: function() { salvarEstadoJanelas(); } 
              })
              .mousedown(function() { focusWin($(this)); $(this).addClass('active-win'); })
              .mouseup(function() { $(this).removeClass('active-win'); });

            focusWin(win);
            salvarEstadoJanelas();
        }

        $(document).ready(function() {
            restaurarTema();
            restaurarEstadoJanelas();
        });
    </script>
</body>
</html>
