<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.R.I.D OS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'JetBrains Mono', monospace; background-color: #0a0c10; color: #cbd5e1; }
        
        /* Grelha Gigante de Fundo */
        .grid-canvas {
            background-image: radial-gradient(rgba(62, 207, 142, 0.1) 1.5px, transparent 1.5px);
            background-size: 60px 60px; /* Grelha maior como tinhas */
            width: 100vw; height: 100vh;
        }

        /* Página Soft de Entrada */
        #landing-page {
            z-index: 100;
            background: radial-gradient(circle at center, #111827 0%, #0a0c10 100%);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .window-node { position: absolute !important; }
        .window-handle { cursor: move; }
        
        /* Ícone de Resizable no canto */
        .ui-resizable-se {
            bottom: 4px; right: 4px; width: 10px; height: 10px;
            background: #3ecf8e; border-radius: 2px; opacity: 0.3;
        }

        .soft-glow { text-shadow: 0 0 20px rgba(62, 207, 142, 0.3); }
        .btn-launch {
            border: 1px solid rgba(62, 207, 142, 0.3);
            transition: all 0.3s ease;
        }
        .btn-launch:hover {
            background: #3ecf8e; color: #000;
            box-shadow: 0 0 30px rgba(62, 207, 142, 0.4);
        }
    </style>
</head>
<body class="overflow-hidden">

    <div id="landing-page" class="fixed inset-0 flex flex-col items-center justify-center">
        <div class="grid-canvas absolute inset-0 opacity-30"></div>
        
        <div class="relative z-10 flex flex-col items-center">
            <div class="mb-6 text-[#3ecf8e] animate-pulse">
                <svg class="w-20 h-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
            <h1 class="text-5xl font-black tracking-tighter text-white mb-2 soft-glow italic">G.R.I.D</h1>
            <p class="text-xs tracking-[0.5em] text-slate-500 uppercase mb-12">Ground Recon & Intelligent Detection</p>
            
            <button onclick="launchDashboard()" class="btn-launch px-12 py-4 rounded-full text-[10px] font-bold tracking-[0.3em] uppercase">
                Inicializar Consola
            </button>
        </div>

        <div class="absolute bottom-10 text-[8px] text-slate-600 tracking-widest uppercase">
            Sessão Ativa: <span class="text-slate-400">{{ username }}</span> | PAP 2026
        </div>
    </div>

    <div id="main-dashboard" class="flex h-screen w-screen relative grid-canvas opacity-0 pointer-events-none transition-opacity duration-1000">
        
        <aside class="w-16 flex flex-col items-center py-6 bg-[#0d1117]/80 backdrop-blur-xl border-r border-white/5 z-50">
            <div class="mb-12 text-[#3ecf8e]">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>

            <nav class="flex flex-col gap-10 flex-1">
                <button onclick="createWindow('camera', 'FEED VÍDEO')" class="text-slate-500 hover:text-[#3ecf8e] transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </button>
                <button onclick="createWindow('distancia', 'DISTÂNCIA')" class="text-slate-500 hover:text-[#3ecf8e] transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                </button>
                <button onclick="createWindow('gas', 'SENSOR MQ2')" class="text-slate-500 hover:text-[#3ecf8e] transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="1.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </button>
            </nav>

            <div class="flex flex-col gap-6 mb-2">
                <button class="text-slate-600 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg></button>
                <button class="text-red-500/40 hover:text-red-500"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="1.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg></button>
            </div>
        </aside>

        <main id="workspace" class="flex-1 relative">
            <div class="absolute top-6 left-6 flex items-center gap-3">
                <div class="w-2 h-2 bg-[#3ecf8e] rounded-full animate-pulse"></div>
                <span class="text-[10px] font-black tracking-widest text-[#3ecf8e]/60 uppercase">Bridge Online</span>
            </div>
        </main>
    </div>

    <script>
        // Transição entre Página Soft e Dashboard
        function launchDashboard() {
            const landing = document.getElementById('landing-page');
            const dash = document.getElementById('main-dashboard');
            
            landing.style.opacity = '0';
            landing.style.transform = 'scale(1.1)';
            setTimeout(() => {
                landing.remove();
                dash.classList.remove('opacity-0', 'pointer-events-none');
            }, 800);
        }

        let windowZIndex = 100;
        const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

        client.on('connect', () => {
            client.subscribe('G.R.I.D/Distancia');
            client.subscribe('G.R.I.D/MQ2');
        });

        client.on('message', (topic, message) => {
            const val = message.toString();
            if (topic === 'G.R.I.D/Distancia') {
                $('#val-dist').text(val);
                $('#bar-dist').css('width', Math.min((val/400)*100, 100) + '%');
            }
            if (topic === 'G.R.I.D/MQ2') {
                $('#val-mq2').text(val);
                $('#bar-mq2').css('width', Math.min((val/1024)*100, 100) + '%');
            }
        });

        function createWindow(type, title) {
            if (document.getElementById(`win-${type}`)) return;

            const win = document.createElement('div');
            win.id = `win-${type}`;
            win.className = "window-node bg-[#0d1117]/95 border border-white/5 rounded-xl shadow-2xl overflow-hidden flex flex-col backdrop-blur-md";
            win.style.width = "340px";
            win.style.height = "220px";
            win.style.left = (100 + (windowZIndex-100)*30) + "px";
            win.style.top = "150px";
            win.style.zIndex = ++windowZIndex;

            win.innerHTML = `
                <div class="window-handle bg-white/5 px-4 py-3 flex justify-between items-center border-b border-white/5 select-none">
                    <span class="text-[9px] font-black tracking-widest text-[#3ecf8e] uppercase">${title}</span>
                    <button onclick="document.getElementById('${win.id}').remove()" class="text-slate-500 hover:text-white">×</button>
                </div>
                <div class="flex-1 p-6 flex flex-col justify-center">
                    ${getTemplate(type)}
                </div>
            `;

            document.getElementById('workspace').appendChild(win);

            $(win).draggable({ handle: ".window-handle", containment: "parent" })
                 .resizable({ handles: "se", minHeight: 180, minWidth: 280 });
        }

        function getTemplate(type) {
            if(type === 'camera') return '<div class="w-full h-full bg-black/40 rounded flex items-center justify-center italic text-[9px] text-slate-600">Waiting for stream...</div>';
            if(type === 'distancia') return `
                <div class="space-y-4 font-mono">
                    <div class="flex justify-between items-end"><span class="text-[10px] text-slate-500 uppercase">Obstáculo</span><span class="text-[#3ecf8e] text-3xl font-black"><span id="val-dist">--</span><span class="text-[10px] ml-1">cm</span></span></div>
                    <div class="w-full bg-white/5 h-1.5 rounded-full overflow-hidden"><div id="bar-dist" class="bg-[#3ecf8e] h-full w-0 transition-all duration-500 shadow-[0_0_10px_#3ecf8e]"></div></div>
                </div>`;
            if(type === 'gas') return `
                <div class="space-y-4 font-mono">
                    <div class="flex justify-between items-end"><span class="text-[10px] text-slate-500 uppercase">Qualidade Ar</span><span class="text-orange-400 text-3xl font-black"><span id="val-mq2">--</span><span class="text-[10px] ml-1">ppm</span></span></div>
                    <div class="w-full bg-white/5 h-1.5 rounded-full overflow-hidden"><div id="bar-mq2" class="bg-orange-500 h-full w-0 transition-all duration-500 shadow-[0_0_10px_orange]"></div></div>
                </div>`;
        }
    </script>
</body>
</html>
