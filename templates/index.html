<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.R.I.D OS | Mission Control</title>
 
    <!-- PWA -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#3ecf8e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="G.R.I.D">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d1117;
            --sidebar-bg: #161b22;
            --text-main: #c9d1d9;
            --text-nav: #8b949e;
            --window-bg: rgba(22, 27, 34, 0.96);
            --win-header: rgba(48, 54, 61, 0.5);
            --grid-color: rgba(62, 207, 142, 0.1);
            --win-border: rgba(48, 54, 61, 0.8);
            --accent: #3ecf8e;
        }
        body.light-mode {
            --bg-color: #f0f4f8;
            --sidebar-bg: #ffffff;
            --text-main: #1a202c;
            --text-nav: #4a5568;
            --window-bg: rgba(255, 255, 255, 0.96);
            --win-header: #edf2f7;
            --grid-color: rgba(0, 0, 0, 0.05);
            --win-border: rgba(0, 0, 0, 0.1);
        }
 
        * { box-sizing: border-box; }
        body { 
            font-family: 'JetBrains Mono', monospace; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            overflow: hidden; 
        }
        .grid-canvas {
            background-image: radial-gradient(var(--grid-color) 1.5px, transparent 1.5px);
            background-size: 40px 40px;
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
        }
 
        /* ═══════════════════════════════════
           SIDEBAR — DESKTOP
        ═══════════════════════════════════ */
        /* sidebar CSS moved to _sidebar.html include */
 
        /* ═══════════════════════════════════
           BOTTOM NAV — MOBILE
        ═══════════════════════════════════ */
        #bottom-nav {
            display: none;
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
            background: var(--sidebar-bg);
            border-top: 1px solid var(--win-border);
            padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
            justify-content: space-around;
            align-items: center;
        }
        .bnav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: var(--text-nav); font-size: 8px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.8px;
            background: none; border: none; cursor: pointer; padding: 4px 10px;
            text-decoration: none; min-width: 52px;
            transition: color 0.2s;
        }
        .bnav-item:hover, .bnav-item:active { color: var(--accent); }
        .bnav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; }
 
        /* Drawer mobile de sensores */
        #mobile-sensor-drawer {
            display: none;
            position: fixed; bottom: calc(60px + env(safe-area-inset-bottom)); left: 0; right: 0;
            z-index: 999;
            background: var(--sidebar-bg);
            border-top: 1px solid var(--win-border);
            padding: 16px;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .drawer-btn {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 14px;
            background: rgba(62,207,142,0.05);
            border: 1px solid var(--win-border);
            border-radius: 12px;
            color: var(--text-nav); font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .drawer-btn:active { background: rgba(62,207,142,0.15); color: var(--accent); }
        .drawer-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; flex-shrink: 0; }
 
        /* ═══════════════════════════════════
           WORKSPACE & JANELAS — DESKTOP
        ═══════════════════════════════════ */
        #workspace { flex: 1; position: relative; overflow: hidden; }
 
        .window-node { 
            position: absolute !important; 
            background-color: var(--window-bg) !important;
            border: 1px solid var(--win-border) !important; 
            border-radius: 20px;
            display: flex; flex-direction: column; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(12px); 
            min-width: 200px; min-height: 150px; 
            overflow: hidden;
            z-index: 10;
        }
        .dragging {
            border-color: var(--accent) !important;
            box-shadow: 0 0 25px rgba(62, 207, 142, 0.4) !important;
            z-index: 999 !important;
        }
        .window-handle { background-color: var(--win-header); border-bottom: 1px solid var(--win-border); padding: 12px 18px; cursor: move; flex-shrink: 0; }
        .window-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .sensor-val { font-size: 2.5rem; font-weight: 800; color: var(--accent); line-height: 1; }
        .label-sub { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.4; margin-bottom: 8px; }
 
        .ui-resizable-se { 
            width: 14px !important; height: 14px !important; 
            right: 8px !important; bottom: 8px !important; 
            background: none !important; 
            border-right: 3px solid var(--accent) !important; 
            border-bottom: 3px solid var(--accent) !important; 
            opacity: 0.5;
        }
 
        /* ═══════════════════════════════════
           CARDS — MOBILE
        ═══════════════════════════════════ */
        #mobile-workspace {
            display: none;
            flex-direction: column;
            gap: 12px;
            padding: 16px 16px calc(80px + env(safe-area-inset-bottom));
            overflow-y: auto;
            height: 100%;
        }
        .mobile-card {
            background: var(--window-bg);
            border: 1px solid var(--win-border);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(12px);
        }
        .mobile-card-header {
            background: var(--win-header);
            border-bottom: 1px solid var(--win-border);
            padding: 10px 16px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .mobile-card-header span { font-size: 9px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; }
        .mobile-card-header button { color: #6b7280; background: none; border: none; font-size: 16px; cursor: pointer; line-height: 1; padding: 0; }
        .mobile-card-body { padding: 24px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 110px; }
        .mobile-sensor-val { font-size: 3rem; font-weight: 800; color: var(--accent); line-height: 1; }
        .mobile-camera-body { height: 220px; background: black; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .mobile-camera-body img { width: 100%; height: 100%; object-fit: cover; }
 
        /* ═══════════════════════════════════
           ROVER BADGE
        ═══════════════════════════════════ */
        #rover-dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; transition: background 0.4s; flex-shrink: 0; }
        #rover-dot.online { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse-dot 2s infinite; }
        #rover-dot.offline { background: #f85149; }
        @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
 
        /* ═══════════════════════════════════
           BREAKPOINT MOBILE ≤ 768px
        ═══════════════════════════════════ */
        @media (max-width: 768px) {
            body { overflow: hidden; }
            #sidebar { display: none !important; }
            #bottom-nav { display: flex; }
            #mobile-workspace { display: flex; }
            #workspace { display: none; }
            #rover-badge-gone {
                display: none;
            }
            body.flex { flex-direction: column; }
        }
    </style>
</head>
<body class="flex h-screen">
 
    <div class="grid-canvas"></div>
 
    <!-- ══════════════════════════════════════
         SIDEBAR (desktop)
    ══════════════════════════════════════ -->
    {% set active_page = 'dashboard' %}
    {% include '_sidebar.html' %}
 
    <!-- ══════════════════════════════════════
         WORKSPACE DESKTOP (janelas drag)
    ══════════════════════════════════════ -->
    <main id="workspace" class="flex-1 relative">
        <!-- Header do dashboard — estilo Admin Panel -->
        <div class="dash-header" style="position:absolute;top:0;left:0;right:0;z-index:500;pointer-events:none;user-select:none;padding:14px 28px 12px;border-bottom:1px solid var(--win-border);display:flex;justify-content:space-between;align-items:center;background:transparent;">
            <div>
                <div style="font-family:'JetBrains Mono',monospace;font-size:1.2rem;font-weight:800;letter-spacing:0.08em;color:var(--text-main);text-transform:uppercase;text-shadow:0 1px 8px var(--sidebar-bg),0 0 20px var(--sidebar-bg);">G.R.I.D OS <span style="color:var(--text-nav);font-weight:300;">//</span> Dashboard</div>
                <div style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:400;color:var(--text-nav);margin-top:2px;letter-spacing:0.1em;text-shadow:0 1px 6px var(--sidebar-bg);">Sessão activa como: <span style="color:#3ecf8e;font-weight:700;">{{ username }}</span></div>
            </div>
            <div style="display:flex;align-items:center;gap:16px;">
                <div style="background:var(--sidebar-bg);border:1px solid var(--win-border);border-radius:10px;padding:8px 14px;display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;">
                    <span id="rover-dot"></span>
                    <span style="color:var(--text-nav);">ROVER_01:</span>
                    <span id="rover-status-text" style="color:var(--text-nav);">A AGUARDAR</span>
                </div>
                <div style="background:var(--sidebar-bg);border:1px solid var(--win-border);border-radius:10px;padding:8px 14px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:2px;color:#3ecf8e;">
                    <span id="dashboard-clock">--:--:--</span>
                </div>
            </div>
        </div>
        <!-- Watermark central desfocada -->
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:0;pointer-events:none;user-select:none;white-space:nowrap;">
            <span style="font-family:'JetBrains Mono',monospace;font-size:clamp(4rem,12vw,10rem);font-weight:800;letter-spacing:0.15em;color:rgba(62,207,142,0.06);text-transform:uppercase;filter:blur(6px);">G.R.I.D</span>
        </div>
    </main>
 
    <!-- ══════════════════════════════════════
         WORKSPACE MOBILE (cards estáticos)
    ══════════════════════════════════════ -->
    <main id="mobile-workspace">
        <!-- Título mobile -->
        <div style="padding:16px 16px 0;pointer-events:none;user-select:none;">
            <span style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:0.25em;color:rgba(62,207,142,0.5);text-transform:uppercase;">G.R.I.D</span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:400;letter-spacing:0.15em;color:rgba(100,116,139,0.5);text-transform:uppercase;"> // Dashboard</span>
        </div>
    </main>
 
    <!-- ══════════════════════════════════════
         BOTTOM NAV (mobile)
    ══════════════════════════════════════ -->
    <nav id="bottom-nav">
        <button class="bnav-item" onclick="mobileOpen('camera','LIVE_FEED')">
            <svg viewBox="0 0 24 24"><path stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            Câmera
        </button>
        <button class="bnav-item" onclick="toggleMobileDrawer()">
            <svg viewBox="0 0 24 24"><path stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
            Sensores
        </button>
        <a href="/logs" class="bnav-item text-orange-400">
            <svg viewBox="0 0 24 24"><path stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            Logs
        </a>
        <button class="bnav-item text-blue-400" onclick="mobileScrollTop()">
            <svg viewBox="0 0 24 24"><path stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
            Topo
        </button>
        <button class="bnav-item" onclick="toggleTheme()">
            <svg viewBox="0 0 24 24"><path stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            Tema
        </button>
        <a href="/logout" class="bnav-item text-red-400">
            <svg viewBox="0 0 24 24"><path stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7"></path></svg>
            Sair
        </a>
    </nav>
 
    <!-- Drawer mobile de sensores -->
    <div id="mobile-sensor-drawer">
        <button class="drawer-btn" onclick="mobileOpen('mq2','MQ2_GAS'); toggleMobileDrawer()">
            <svg viewBox="0 0 24 24"><path stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            MQ2 Gas
        </button>
        <button class="drawer-btn" onclick="mobileOpen('dist','HCSR04'); toggleMobileDrawer()">
            <svg viewBox="0 0 24 24"><path stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2z"></path></svg>
            HC-SR04
        </button>
        <button class="drawer-btn" onclick="mobileOpen('mpu','MPU6050'); toggleMobileDrawer()">
            <svg viewBox="0 0 24 24"><path stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            MPU6050
        </button>
        <button class="drawer-btn" onclick="mobileOpen('bmp','BMP280'); toggleMobileDrawer()">
            <svg viewBox="0 0 24 24"><path stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
            BMP280
        </button>
    </div>
 

 
    <script>
        const socket = io();
        let zIdx = 100;
        let folderOpenState = false;
        let drawerOpen = false;
 
        const isMobile = () => window.innerWidth <= 768;
 
        // ── Tema ────────────────────────────────────────────────
        function toggleTheme() { 
            document.body.classList.toggle('light-mode'); 
            localStorage.setItem('grid_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        }
 
        // ── Sidebar desktop: pasta de sensores ──────────────────
        function toggleFolderManual() {
            folderOpenState = !folderOpenState;
            const arrow = document.getElementById('folder-arrow');
            if (folderOpenState) { $('#sensor-folder').slideDown(300); if(arrow) arrow.textContent='▲'; }
            else                 { $('#sensor-folder').slideUp(300);   if(arrow) arrow.textContent='▼'; }
        }

 
        // ── Drawer mobile de sensores ───────────────────────────
        function toggleMobileDrawer() {
            drawerOpen = !drawerOpen;
            const drawer = document.getElementById('mobile-sensor-drawer');
            if (drawerOpen) {
                drawer.style.display = 'grid';
                requestAnimationFrame(() => drawer.style.opacity = '1');
            } else {
                drawer.style.display = 'none';
            }
        }
 
        // ── Auto Tile (desktop) ─────────────────────────────────
        function autoTile() {
            const janelas = $('.window-node:visible');
            if (janelas.length === 0) return;

            const hh    = $('.dash-header').outerHeight() || 65;
            const gap   = 12;
            const padL  = 10, padT = hh + 10;
            const ws    = document.getElementById('workspace');
            const workW = ws.clientWidth;
            const workH = ws.clientHeight;

            let x = padL, y = padT, rowH = 0;

            janelas.each(function() {
                let w = $(this).outerWidth();
                let h = $(this).outerHeight();

                // Reduz só se for mais larga que o workspace
                if (w > workW - padL * 2) w = workW - padL * 2;

                // Passa para próxima linha se não couber
                if (x + w > workW - padL && x > padL) {
                    x = padL; y += rowH + gap; rowH = 0;
                }

                // Reduz altura só se sair abaixo do ecrã
                const maxH = workH - y - 10;
                if (h > maxH) h = Math.max(160, maxH);

                $(this).stop().animate({ left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }, 400);
                x += w + gap;
                if (h > rowH) rowH = h;
            });
        }
 
        function mobileScrollTop() {
            document.getElementById('mobile-workspace').scrollTo({ top: 0, behavior: 'smooth' });
        }
 
        // ── Mapa de dados dos sensores (tópicos MQTT reais) ─────
        // MQTT: G.R.I.D/MQ2, G.R.I.D/Distancia, G.R.I.D/Acel_X, G.R.I.D/Gyro_X, G.R.I.D/Temperatura, G.R.I.D/Pressao
        const sensorMap = { 
            mq2: 'MQ2', 
            dist: 'Distancia', 
            mpu: 'Acel_X',      // MPU6050 envia Acel_X, Acel_Y, Acel_Z, Gyro_X, Gyro_Y, Gyro_Z
            bmp: 'Temperatura'  // BMP280 envia Temperatura e Pressao
        };
        const unitMap   = { 
            mq2: 'ppm', 
            dist: 'cm', 
            mpu: 'm/s²', 
            bmp: '°C' 
        };
        const labelMap  = { 
            mq2: 'Sensor de Gás MQ2', 
            dist: 'Ultrassónico HC-SR04', 
            mpu: 'Acelerómetro MPU6050', 
            bmp: 'Barómetro BMP280' 
        };
 
        // ── Criar janela (desktop) ──────────────────────────────
        function createWindow(type, title) {
            if (isMobile()) { mobileOpen(type, title); return; }
 
            const id = `win-${type}`;
            if (document.getElementById(id)) { zIdx++; $(`#${id}`).css('z-index', zIdx); return; }
 
            const body = type === 'camera' ?
                `<div class="window-content bg-black w-full h-full flex items-center justify-center overflow-hidden">
                    <img src="http://172.20.10.4:81/stream" class="w-full h-full object-cover"
                         onerror="this.style.display='none';document.getElementById('cam-err').classList.remove('hidden')"/>
                    <div id="cam-err" class="hidden text-[10px] text-red-500 font-bold animate-pulse">[NO SIGNAL]</div>
                </div>` :
                `<div class="window-content p-6">
                    <div class="label-sub">${labelMap[type]||title}</div>
                    <div class="sensor-val">
                        <span id="val-${sensorMap[type]}">--</span>
                        <span class="text-xs ml-2 opacity-30">${unitMap[type]}</span>
                    </div>
                </div>`;
 
            const w = type === 'camera' ? '460px' : '340px';
            const h = type === 'camera' ? '290px' : '200px';
 
            const hh2 = $('.dash-header').outerHeight() || 65;
            $(`<div id="${id}" class="window-node" style="width:${w};height:${h};top:${hh2+10}px;left:100px;">
                <div class="window-handle flex justify-between items-center">
                    <span class="text-[9px] font-bold text-[#3ecf8e] uppercase tracking-widest">${title}</span>
                    <button onclick="$(this).closest('.window-node').remove()" class="text-gray-400 hover:text-red-500 transition-colors">✕</button>
                </div>
                ${body}
            </div>`)
            .appendTo('#workspace')
            .draggable({ handle:'.window-handle', containment:'parent',
                start: function(){ zIdx++; $(this).css('z-index',zIdx).addClass('dragging'); },
                drag:  function(e, ui){
                    const hh = $('.dash-header').outerHeight() || 65;
                    if(ui.position.top < hh) ui.position.top = hh;
                },
                stop:  function(){ $(this).removeClass('dragging'); }
            })
            .resizable({ handles:'se', minWidth:240, minHeight:160, containment:'parent' })
            .mousedown(function(){ zIdx++; $(this).css('z-index',zIdx); });
        }
 
        // ── Abrir card (mobile) ─────────────────────────────────
        function mobileOpen(type, title) {
            const id = `mcard-${type}`;
            const existing = document.getElementById(id);
            if (existing) { existing.scrollIntoView({ behavior:'smooth', block:'start' }); return; }
 
            const body = type === 'camera' ?
                `<div class="mobile-camera-body">
                    <img src="http://172.20.10.4:81/stream" style="width:100%;height:100%;object-fit:cover"
                         onerror="this.style.display='none'"/>
                    <span style="color:#f85149;font-size:10px;font-weight:700;display:none" class="anim-pulse">[NO SIGNAL]</span>
                </div>` :
                `<div class="mobile-card-body">
                    <div class="label-sub" style="font-size:9px;text-transform:uppercase;letter-spacing:2px;opacity:.4;margin-bottom:8px">${labelMap[type]||title}</div>
                    <div class="mobile-sensor-val">
                        <span id="mval-${sensorMap[type]}">--</span>
                        <span style="font-size:.75rem;margin-left:.5rem;opacity:.3">${unitMap[type]}</span>
                    </div>
                </div>`;
 
            const card = $(`
                <div id="${id}" class="mobile-card">
                    <div class="mobile-card-header">
                        <span>${title}</span>
                        <button onclick="document.getElementById('${id}').remove()">✕</button>
                    </div>
                    ${body}
                </div>
            `).appendTo('#mobile-workspace');
 
            card[0].scrollIntoView({ behavior:'smooth', block:'start' });
        }
 
        // ── WebSocket: dados sensores ───────────────────────────
        // O servidor Flask emite: {sensor: 'MQ2', valor: '123.45'} ou {sensor: 'Distancia', valor: '45.2'}
        // MPU6050: Acel_X, Acel_Y, Acel_Z, Gyro_X, Gyro_Y, Gyro_Z
        // BMP280: Temperatura, Pressao
        socket.on('mqtt_data', (data) => {
            // Atualiza todos os displays que correspondem a este sensor
            const sensor = data.sensor;
            const valor = data.valor;
            
            // MQ2
            if (sensor === 'MQ2') {
                $('#val-MQ2').text(valor);
                $('#mval-MQ2').text(valor);
            }
            // HC-SR04
            else if (sensor === 'Distancia') {
                $('#val-Distancia').text(valor);
                $('#mval-Distancia').text(valor);
            }
            // MPU6050 - Aceleração
            else if (sensor.startsWith('Acel_') || sensor.startsWith('Gyro_')) {
                $('#val-Acel_X').text(valor);
                $('#mval-Acel_X').text(valor);
            }
            // BMP280 - Temperatura
            else if (sensor === 'Temperatura') {
                $('#val-Temperatura').text(valor);
                $('#mval-Temperatura').text(valor);
            }
            // BMP280 - Pressão
            else if (sensor === 'Pressao') {
                $('#val-Pressao').text(valor);
                $('#mval-Pressao').text(valor);
            }
        });
 
        // ── WebSocket: status rover ─────────────────────────────
        socket.on('rover_status_update', (data) => {
            const dot  = document.getElementById('rover-dot');
            const text = document.getElementById('rover-status-text');
            if (data.status === 'online') {
                dot.className = 'online';
                text.textContent = 'ROVER ONLINE';
            } else {
                dot.className = 'offline';
                text.textContent = 'ROVER OFFLINE';
            }
        });
 
        // ── Init ────────────────────────────────────────────────
        $(document).ready(() => {
            if (localStorage.getItem('grid_theme') === 'light') document.body.classList.add('light-mode');

            // Relógio em tempo real
            function updateClock() {
                const now = new Date();
                const h = String(now.getHours()).padStart(2,'0');
                const m = String(now.getMinutes()).padStart(2,'0');
                const s = String(now.getSeconds()).padStart(2,'0');
                const el = document.getElementById('dashboard-clock');
                if (el) el.textContent = h + ':' + m + ':' + s;
            }
            updateClock();
            setInterval(updateClock, 1000);
        });
    </script>
</body>
</html>
