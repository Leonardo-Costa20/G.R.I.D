<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.R.I.D - Nova Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
        body { font-family: 'JetBrains Mono', monospace; }
        @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(1000%); } }
        .scanline { width: 100%; height: 100px; z-index: 5; background: linear-gradient(0deg, rgba(62,207,142,0.1) 0%, rgba(62,207,142,0) 100%); opacity: 0.1; position: absolute; bottom: 100%; animation: scanline 8s linear infinite; }
        .grid-bg { background-image: radial-gradient(#3ecf8e 1px, transparent 1px); background-size: 30px 30px; }
        .strength-bar { height: 3px; border-radius: 2px; transition: width 0.4s ease, background-color 0.4s ease; }
    </style>
</head>
<body class="bg-[#0a0c10] flex items-center justify-center h-screen overflow-hidden">

    <div class="absolute inset-0 grid-bg opacity-10"></div>
    <div class="scanline"></div>

    <div class="relative w-full max-w-md p-1 z-10">
        <div class="bg-[#12151a] border border-[#30363d] rounded-2xl shadow-2xl p-8 overflow-hidden relative">

            <div class="text-center mb-10">
                <h1 class="text-white text-3xl font-black tracking-[0.4em] uppercase italic">
                    G.R.I.D <span class="text-[#3ecf8e] font-light not-italic">OS</span>
                </h1>
                <p class="text-[#3ecf8e]/60 text-[9px] font-bold tracking-[0.3em] mt-3 uppercase">Definir Nova Password</p>
            </div>

            {% if error %}
            <div class="mb-6 p-4 bg-red-500/10 border border-red-500/40 text-red-400 rounded text-[10px] font-black uppercase text-center italic">
                {{ error }}
            </div>
            {% endif %}

            <form action="/reset-password" method="POST" class="space-y-5" id="reset-form" novalidate>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Nova Password</label>
                    <input type="password" name="password" id="pw1" required placeholder="••••••••" minlength="6"
                           class="w-full bg-black/40 border border-[#30363d] rounded-xl px-4 py-3.5 text-white text-sm focus:border-[#3ecf8e] focus:ring-1 focus:ring-[#3ecf8e]/30 outline-none transition-all placeholder:text-slate-700"
                           oninput="updateStrength(this.value)">
                    <div class="mt-2 bg-gray-800 rounded-full overflow-hidden h-[3px]">
                        <div id="strength-bar" class="strength-bar w-0 bg-red-500"></div>
                    </div>
                    <div id="strength-label" class="text-[9px] text-gray-600 mt-1 ml-1"></div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Confirmar Password</label>
                    <input type="password" name="confirm_password" id="pw2" required placeholder="••••••••"
                           class="w-full bg-black/40 border border-[#30363d] rounded-xl px-4 py-3.5 text-white text-sm focus:border-[#3ecf8e] focus:ring-1 focus:ring-[#3ecf8e]/30 outline-none transition-all placeholder:text-slate-700"
                           oninput="checkMatch()">
                    <div id="match-label" class="text-[9px] mt-1 ml-1 hidden"></div>
                </div>

                <button type="submit" id="submit-btn"
                        class="w-full bg-[#3ecf8e] hover:bg-[#34b37a] text-black font-black py-4 rounded-xl uppercase tracking-[0.2em] text-xs transition-all transform active:scale-[0.98] shadow-[0_0_20px_rgba(62,207,142,0.2)]">
                    Redefinir Password
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-[#30363d] text-center">
                <a href="/login" class="text-[10px] text-slate-500 hover:text-white uppercase italic transition-colors">
                    « Voltar ao Terminal de Acesso
                </a>
            </div>
        </div>
    </div>

    <script>
        function updateStrength(pw) {
            const bar = document.getElementById('strength-bar');
            const label = document.getElementById('strength-label');
            let score = 0;
            if (pw.length >= 6)  score++;
            if (pw.length >= 10) score++;
            if (/[A-Z]/.test(pw)) score++;
            if (/[0-9]/.test(pw)) score++;
            if (/[^A-Za-z0-9]/.test(pw)) score++;

            const levels = [
                { w: '20%',  color: 'bg-red-500',    text: 'FRACA',    tc: 'text-red-500' },
                { w: '40%',  color: 'bg-orange-500',  text: 'RAZOÁVEL', tc: 'text-orange-500' },
                { w: '60%',  color: 'bg-yellow-500',  text: 'MÉDIA',    tc: 'text-yellow-500' },
                { w: '80%',  color: 'bg-blue-400',    text: 'BOA',      tc: 'text-blue-400' },
                { w: '100%', color: 'bg-[#3ecf8e]',   text: 'FORTE',    tc: 'text-[#3ecf8e]' },
            ];
            const idx = Math.max(0, score - 1);
            const lvl = levels[idx];
            bar.style.width = pw.length ? lvl.w : '0%';
            bar.className = `strength-bar ${pw.length ? lvl.color : 'bg-red-500'}`;
            label.textContent = pw.length ? lvl.text : '';
            label.className = `text-[9px] mt-1 ml-1 font-bold ${lvl.tc}`;
            checkMatch();
        }

        function checkMatch() {
            const pw1 = document.getElementById('pw1').value;
            const pw2 = document.getElementById('pw2').value;
            const label = document.getElementById('match-label');
            const btn = document.getElementById('submit-btn');
            if (!pw2) { label.classList.add('hidden'); return; }
            label.classList.remove('hidden');
            if (pw1 === pw2) {
                label.textContent = '✓ PASSWORDS COINCIDEM';
                label.className = 'text-[9px] mt-1 ml-1 font-bold text-[#3ecf8e]';
                btn.disabled = false;
                btn.classList.remove('opacity-40', 'cursor-not-allowed');
            } else {
                label.textContent = '✗ PASSWORDS NÃO COINCIDEM';
                label.className = 'text-[9px] mt-1 ml-1 font-bold text-red-500';
                btn.disabled = true;
                btn.classList.add('opacity-40', 'cursor-not-allowed');
            }
        }

        document.getElementById('reset-form')?.addEventListener('submit', function(e) {
            if (document.getElementById('pw1').value !== document.getElementById('pw2').value) {
                e.preventDefault();
                checkMatch();
            }
        });
    </script>
</body>
</html>
