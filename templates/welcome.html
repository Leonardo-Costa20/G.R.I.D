<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.R.I.D OS</title>

    <!-- PWA -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0a0c10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="G.R.I.D">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700;800&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: #0a0c10;
            color: #c9d1d9;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 32px calc(32px + env(safe-area-inset-bottom));
        }

        .grid-bg {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image: radial-gradient(rgba(62,207,142,0.08) 1.5px, transparent 1.5px);
            background-size: 50px 50px;
        }
        .glow-bg {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: radial-gradient(ellipse 70% 50% at 50% 40%, rgba(62,207,142,0.07) 0%, transparent 70%);
        }

        .center {
            position: relative; z-index: 1;
            display: flex; flex-direction: column;
            align-items: center;
            flex: 1;
            justify-content: center;
        }

        .logo-wrap {
            margin-bottom: 36px;
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%,100% { transform: translateY(0);    filter: drop-shadow(0 0 28px rgba(62,207,142,0.3)); }
            50%      { transform: translateY(-8px); filter: drop-shadow(0 0 48px rgba(62,207,142,0.5)); }
        }
        .logo-wrap img { width: 110px; height: 110px; object-fit: contain; display: block; }
        .logo-svg { width: 110px; height: 110px; }

        .title {
            font-size: clamp(3.2rem, 14vw, 5.5rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 50px rgba(62,207,142,0.2);
            margin-bottom: 10px;
        }
        .title-accent { color: #3ecf8e; }

        .subtitle {
            font-size: 9px; font-weight: 700;
            letter-spacing: 4px; text-transform: uppercase;
            color: #4b5563; white-space: nowrap;
        }

        .buttons {
            position: relative; z-index: 1;
            width: 100%; max-width: 360px;
            display: flex; flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 17px 24px;
            border-radius: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            text-decoration: none; cursor: pointer; border: none;
            transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
            -webkit-tap-highlight-color: transparent;
        }
        .btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; flex-shrink: 0; }

        .btn-signin {
            background: #3ecf8e;
            color: #000;
            box-shadow: 0 0 28px rgba(62,207,142,0.25);
        }
        .btn-signin:active { transform: scale(0.97); background: #34b37a; }

        .btn-signup {
            background: rgba(22,27,34,0.9);
            color: #c9d1d9;
            border: 1px solid rgba(48,54,61,0.9);
            backdrop-filter: blur(12px);
        }
        .btn-signup:active { transform: scale(0.97); border-color: #3ecf8e; color: #3ecf8e; }

        .divider {
            display: flex; align-items: center; gap: 12px;
            color: #1f2937; font-size: 9px; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1;
            height: 1px; background: rgba(48,54,61,0.5);
        }

        .footer-note {
            position: relative; z-index: 1;
            font-size: 8px; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            color: #1f2937; text-align: center;
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>
    <div class="glow-bg"></div>

    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:48px;width:100%;position:relative;z-index:1;">
        <div class="center" style="flex:unset;">
            <div class="logo-wrap">
                <img src="/static/logo.png" alt="G.R.I.D"
                     onerror="this.style.display='none'; document.getElementById('logo-svg').style.display='block'">
                <svg id="logo-svg" class="logo-svg" style="display:none" viewBox="0 0 100 100" fill="none">
                    <circle cx="50" cy="50" r="48" stroke="rgba(62,207,142,0.15)" stroke-width="1.5"/>
                    <circle cx="50" cy="50" r="36" stroke="rgba(62,207,142,0.08)" stroke-width="1"/>
                    <polygon points="56,18 30,54 50,54 44,82 70,46 50,46" fill="#3ecf8e" opacity="0.95"/>
                </svg>
            </div>
            <h1 class="title">G.R.I.D <span class="title-accent">OS</span></h1>
            <p class="subtitle">Ground Recon &amp; Intelligent Detection</p>
        </div>

        <div class="buttons">
            <a href="/login" class="btn btn-signin">
                <svg viewBox="0 0 24 24"><path stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                Sign In
            </a>
            <div class="divider">ou</div>
            <a href="/register" class="btn btn-signup">
                <svg viewBox="0 0 24 24"><path stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                Sign Up
            </a>
        </div>
    </div>

    <p class="footer-note">G.R.I.D OS &middot; PAP 2026</p>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js').catch(() => {});
        }
    </script>
</body>
</html>
