<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.R.I.D - Monitor</title>
    
    <!-- Bibliotecas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

    <style>
        :root {
            --primary: #3ecf8e;
            --bg: #0a0c10;
            --card-bg: #12151a;
            --text: #e6edf3;
            --border: #30363d;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            text-align: center;
            padding: 10px 0;
            pointer-events: none; /* Para não atrapalhar o arrasto por baixo */
        }

        h1 {
            letter-spacing: 10px;
            margin: 0;
            color: var(--primary);
            text-transform: uppercase;
            font-weight: 400;
        }

        .desktop {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Janela Arrastável e Redimensionável */
        .window {
            position: absolute;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-width: 200px;
            min-height: 100px;
        }

        .window-header {
            padding: 10px 15px;
            cursor: move;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .window-title {
            color: #8b949e;
            font-size: 0.65rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .window-body {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        /* Estilo dos Dados */
        .value-large {
            font-size: clamp(1.5rem, 5vw, 3.5rem); /* Tamanho de texto fluido */
            font-weight: 900;
            text-align: center;
            color: var(--primary);
            margin: 0;
        }

        .chart-container {
            flex-grow: 1;
            width: 100%;
            position: relative;
        }

        .video-feed {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* Customização do ícone de resize do JQuery UI */
        .ui-resizable-se {
            bottom: 5px;
            right: 5px;
            background-color: var(--primary);
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="header" style="position: absolute; width: 100%; z-index: 0;">
        <h1>G.R.I.D <span style="font-weight: 100; color: #fff;">MONITOR</span></h1>
    </div>

    <div class="desktop">

        <!-- JANELA VÍDEO -->
        <div id="win-video" class="window" style="top: 80px; left: 50px; width: 500px; height: 350px;">
            <div class="window-header">
                <span class="window-title">FEED TÁTICO EM TEMPO REAL</span>
            </div>
            <div class="window-body">
                <img src="http://172.20.10.4" class="video-feed" onerror="this.src='https://placehold.co/600x400/12151a/3ecf8e?text=SINAL+OFFLINE'">
            </div>
        </div>

        <!-- JANELA DISTÂNCIA -->
        <div id="win-dist" class="window" style="top: 80px; left: 600px; width: 500px; height: 350px;">
            <div class="window-header">
                <span class="window-title">HISTÓRICO DE PROXIMIDADE</span>
            </div>
            <div class="window-body">
                <div id="val-distancia" class="value-large">00.00 cm</div>
                <div class="chart-container">
                    <canvas id="telemetryChart"></canvas>
                </div>
            </div>
        </div>

        <!-- JANELA GÁS -->
        <div id="win-gas" class="window" style="top: 480px; left: 50px; width: 1050px; height: 180px;">
            <div class="window-header">
                <span class="window-title">MONITORIZAÇÃO ATMOSFÉRICA • SENSOR MQ2</span>
            </div>
            <div class="window-body">
                <div id="val-mq2" class="value-large">NÍVEL DE GÁS: 000</div>
            </div>
        </div>

    </div>

    <script>
        $(function() {
            // Torna as janelas Arrastáveis
            $(".window").draggable({
                handle: ".window-header",
                stack: ".window",
                containment: "parent"
            });

            // Torna as janelas Redimensionáveis
            $(".window").resizable({
                handles: "se", // Apenas no canto inferior direito
                resize: function(event, ui) {
                    // Atualiza o gráfico quando a janela muda de tamanho
                    if (this.id === 'win-dist') {
                        telemetryChart.resize();
                    }
                }
            });
        });

        // MQTT Config
        const CONFIG = {
            host: "79cfe6e1598b447b95c57a4303744c21.s1.eu.hivemq.cloud",
            port: 8884,
            user: "ROVER-1",
            pass: "Rover1grid",
            id: "grid_" + Math.random().toString(16).substring(2, 6)
        };

        // Gráfico
        const ctx = document.getElementById('telemetryChart').getContext('2d');
        const telemetryChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(30).fill(''),
                datasets: [{
                    data: Array(30).fill(0),
                    borderColor: '#3ecf8e',
                    backgroundColor: 'rgba(62, 207, 142, 0.1)',
                    fill: true, tension: 0.4, borderWidth: 3, pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    x: { display: false },
                    y: { min: 0, max: 200, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8b949e' } }
                },
                plugins: { legend: { display: false } }
            }
        });

        const client = new Paho.MQTT.Client(CONFIG.host, CONFIG.port, CONFIG.id);
        client.onMessageArrived = (msg) => {
            if (msg.destinationName.includes("Distancia")) {
                const val = parseFloat(msg.payloadString);
                document.getElementById('val-distancia').innerText = val.toFixed(2) + " cm";
                telemetryChart.data.datasets[0].data.push(val);
                telemetryChart.data.datasets[0].data.shift();
                telemetryChart.update('none');
            }
            if (msg.destinationName.includes("MQ2")) {
                document.getElementById('val-mq2').innerText = "NÍVEL DE GÁS: " + msg.payloadString;
            }
        };

        client.connect({
            useSSL: true, userName: CONFIG.user, password: CONFIG.pass,
            onSuccess: () => client.subscribe("G.R.I.D/#")
        });
    </script>
</body>
</html>
